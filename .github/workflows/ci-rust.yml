name: ci-rust

on:
  push:
    branches: [main]
    # The Rust tests read conformance/vectors/ps-kat.json (rust/tests/kat.rs and
    # rust/src/lib.rs resolve it relative to CARGO_MANIFEST_DIR), and a change to this
    # workflow file is itself a change to what is being checked. Both sit outside
    # rust/**, so without them listed here this job does not run when its own inputs move.
    paths:
      - 'rust/**'
      - 'conformance/vectors/ps-kat.json'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'conformance/vectors/ps-kat.json'
      - '.github/workflows/ci-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # The workspace is rust/, not the repository root. Without this the action
          # runs cargo metadata at the root, logs an error and restores nothing.
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
