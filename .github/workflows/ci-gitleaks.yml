name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history required so gitleaks --log-opts=--all can scan every
          # commit, not just the tip.  A shallow clone would silently miss
          # secrets introduced in prior commits.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          config: .gitleaks.toml
          fail: true
          log-opts: "--all"
        env:
          # GITHUB_TOKEN is needed by the action to post annotations on PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
