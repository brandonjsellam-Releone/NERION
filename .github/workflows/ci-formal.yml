name: Formal (TLC)

# Machine-checks the TLA+ accountable-safety model on every change to docs/formal/.
# TLC exits non-zero on any invariant violation or genuine deadlock, failing the build.
on:
  push:
    paths: ['docs/formal/**', '.github/workflows/ci-formal.yml']
  pull_request:
    paths: ['docs/formal/**', '.github/workflows/ci-formal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch TLA+ tools (tla2tools v1.8.0)
        # -f so an HTTP error page is never silently written to tla2tools.jar.
        run: |
          set -euo pipefail
          curl -fsSL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      # Supply-chain gate: this jar is third-party code that the next step
      # executes with `java`. Without this check any compromise of the release
      # asset, the CDN, or the transport would run arbitrary code in CI.
      - name: Verify tla2tools.jar integrity (pinned SHA-256)
        env:
          # SHA-256 of tla2tools.jar on the tlaplus v1.8.0 pre-release, hashed 2026-09-17
          # (4,492,966 bytes; the asset's updated_at was 2026-09-17T03:25:16Z when this pin was taken).
          #
          # Trust-on-first-use: the GitHub API digest comes from the same release, so it is not an
          # independent channel. tlaplus main.yml deletes and re-uploads this asset on every successful
          # master build, so this pin is a stop-gap until Formal moves to an immutable artifact.
          # The previous pin ab323b79... (4,486,193 bytes, recorded 2026-08-12) stopped matching.
          # A mismatch is the tripwire working: re-pin deliberately; never add a fallback or a retry,
          # and never remove this check.
          #
          # Checked before re-pinning, with temurin 21 and this exact jar:
          #   TLC2 Version 2026.09.17.032053 (rev: 142d0ba)
          #   NerionConsensus.cfg        No error has been found;  144 distinct states
          #   NerionConsensus_6v1b.cfg   No error has been found;  972 distinct states
          #   NerionConsensus_7v2b.cfg   No error has been found; 3888 distinct states
          # The verdict and all three counts are unchanged from the previous jar, so this is a
          # re-pin only and not a model finding.
          #
          # To re-pin:
          #   curl -fsSL -o /tmp/tla2tools.jar \
          #     https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          #   sha256sum /tmp/tla2tools.jar
          TLA2TOOLS_SHA256: 9d36716ffb5e49d1ba8fae4651eba59f3189887e12eb90e204a42d2e6e993fef
        run: |
          set -euo pipefail
          echo "${TLA2TOOLS_SHA256}  tla2tools.jar" | sha256sum -c -
      - name: Model-check NerionConsensus (all configurations)
        working-directory: docs/formal
        run: |
          set -e
          for cfg in NerionConsensus.cfg NerionConsensus_6v1b.cfg NerionConsensus_7v2b.cfg; do
            echo "::group::TLC $cfg"
            java -cp "$GITHUB_WORKSPACE/tla2tools.jar" tlc2.TLC -config "$cfg" NerionConsensus.tla
            echo "::endgroup::"
          done
