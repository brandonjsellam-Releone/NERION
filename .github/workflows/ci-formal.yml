name: Formal (TLC)

# Machine-checks the TLA+ accountable-safety model on every change to docs/formal/.
# TLC exits non-zero on any invariant violation or genuine deadlock, failing the build.
on:
  push:
    paths: ['docs/formal/**', '.github/workflows/ci-formal.yml']
  pull_request:
    paths: ['docs/formal/**', '.github/workflows/ci-formal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch TLA+ tools (tla2tools v1.8.0)
        # -f so an HTTP error page is never silently written to tla2tools.jar.
        run: |
          set -euo pipefail
          curl -fsSL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      # Supply-chain gate: this jar is third-party code that the next step
      # executes with `java`. Without this check any compromise of the release
      # asset, the CDN, or the transport would run arbitrary code in CI.
      - name: Verify tla2tools.jar integrity (pinned SHA-256)
        env:
          # SHA-256 of the tla2tools.jar asset on the tlaplus v1.8.0 release,
          # recorded 2026-08-12 (4,486,193 bytes).
          #
          # NOTE: upstream v1.8.0 is a rolling PRE-RELEASE — its assets were
          # last re-uploaded 2026-08-11, 27 days after the release was created.
          # If upstream re-rolls the jar this step will fail the build. That is
          # the intended behaviour: do NOT weaken or remove the check. Re-pin
          # deliberately after reviewing the new artifact:
          #   curl -fsSL -o /tmp/tla2tools.jar \
          #     https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          #   sha256sum /tmp/tla2tools.jar
          TLA2TOOLS_SHA256: ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f
        run: |
          set -euo pipefail
          echo "${TLA2TOOLS_SHA256}  tla2tools.jar" | sha256sum -c -
      - name: Model-check NerionConsensus (all configurations)
        working-directory: docs/formal
        run: |
          set -e
          for cfg in NerionConsensus.cfg NerionConsensus_6v1b.cfg NerionConsensus_7v2b.cfg; do
            echo "::group::TLC $cfg"
            java -cp "$GITHUB_WORKSPACE/tla2tools.jar" tlc2.TLC -config "$cfg" NerionConsensus.tla
            echo "::endgroup::"
          done
