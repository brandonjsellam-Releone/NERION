# A35: OIDC-based SLSA build provenance for Nerion releases.
#
# Uses slsa-framework/slsa-github-generator to produce a signed SLSA provenance
# attestation for release artifacts. Triggered on release tag pushes or
# manually via workflow_dispatch.
#
# Scope: id-token:write (narrow — provenance signing only). No contents:write
# on the gate job. No push to main from this workflow.
#
# Hard constraints (Innovation Sprint 1):
#   - id-token:write is the ONLY elevated permission; contents is read-only.
#   - Does NOT modify source, KAT vectors, or conformance files.
#   - Does NOT push to main.
#   - NOT a FIPS or audit certification claim.

name: slsa-provenance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The build lives in one reusable workflow so that the artifact this job attests is
  # produced by exactly the steps ci.yml runs on every push. It refuses to package a
  # stand-in: if the build produces no dist/, the job fails instead of tarring
  # README/LICENSE/NOTICE and handing their digest to the generator.
  build:
    name: Build release artifact
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifact.yml
    with:
      upload: true

  provenance:
    name: SLSA provenance
    needs: [build]
    # slsa-github-generator requires id-token:write for OIDC signing.
    # All other permissions remain at the default (read).
    permissions:
      id-token: write
      contents: read
      actions: read
    # Referenced by TAG, not by commit SHA, and that is required rather than sloppy:
    # slsa-github-generator checks its own invocation ref and refuses to run when it is
    # called by SHA, because the ref is what the generated provenance names as the
    # builder id. Pin by moving this tag deliberately; do not "fix" it to a SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: false
