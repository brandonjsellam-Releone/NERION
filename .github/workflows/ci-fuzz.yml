name: Fuzz (smoke)

# Builds the isolated rust/fuzz/ crate and bounded-runs each target on every change
# to rust/. This is a SMOKE test (seconds per target) that catches panics/aborts on
# adversarial input — NOT a full fuzzing campaign (those are manual/scheduled, longer).
# A panic/abort/crash makes the job fail. Runs on Linux where nightly + cargo-fuzz work.
on:
  push:
    paths: ['rust/**', '.github/workflows/ci-fuzz.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/ci-fuzz.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to the 40-char commit SHA at the head of the action's `nightly`
      # branch. The channel is now also passed explicitly, so which toolchain
      # gets installed no longer depends on the branch the SHA was taken from.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke-fuzz each target (bounded)
        working-directory: rust
        run: |
          set -e
          for t in fuzz_aead_open fuzz_hmac_verify fuzz_mlkem_roundtrip; do
            echo "::group::$t"
            cargo +nightly fuzz run "$t" -- -max_total_time=45 -rss_limit_mb=4096
            echo "::endgroup::"
          done
