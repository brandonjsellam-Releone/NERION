name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      # Reproducibility: install from the committed lockfile only.
      - run: npm ci
      # Clean-room / non-infringement gate (CLEANROOM.md F1–F8).
      - run: npm run lint:cleanroom
      # Format + type + tests (KATs, round-trips, tamper, determinism).
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # Regenerate KAT vectors and fail if they drift from the committed file.
      - run: node crypto/vectors/_gen.mjs && git diff --exit-code crypto/vectors/deterministic-kat.json

  # Rust hot-path gate (backlog A1, the keystone): fmt + clippy + the committed
  # KAT reproduction. `cargo test` byte-matches conformance/vectors/ps-kat.json,
  # so a Rust regression or an accidental vector edit turns this job red.
  gate-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to a 40-char commit SHA (supply-chain hygiene); `stable` channel.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (v1)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust

  # The Solidity half of the TS<->Solidity golden-vector lock had never been executed. The
  # contract, its 5 forge tests, and foundry.toml were all committed; no workflow referenced
  # forge, so `git grep -l forge .github/workflows` returned nothing. The vectors are in fact
  # correct - an independent re-check reproduced all four from the Solidity encoding with a
  # from-scratch keccak-256, and crypto/src/domains.ts is byte-equal to the contract literals -
  # so the risk here is future drift, not present divergence. This makes drift visible.
  #
  # Stock solc ^0.8.24 + forge-std is enough: the tests call only evmSetId/evmMessage, so no
  # Zond or Hyperion toolchain is involved.
  contracts:
    name: Solidity tests (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@8f1998e9878d786675189ef566a2e4bf24869773 # v1.2.0
        with:
          version: stable
      # forge-std is not vendored and is not a submodule: contracts/README.md:41 documents
      # `forge install foundry-rs/forge-std` as a manual step, which is why these tests have
      # never actually been runnable from a clean checkout. Cloned at a pinned tag rather than
      # `forge install`, so the dependency is reproducible and does not float with whatever
      # forge's default resolution does today.
      - name: Fetch forge-std (pinned)
        working-directory: contracts
        run: |
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
          echo "forge-std $(git -C lib/forge-std describe --tags)"

      - name: forge test
        working-directory: contracts
        run: |
          set -o pipefail
          forge test -vv 2>&1 | tee forge.log
          # A suite that silently shrinks to zero still exits 0. The golden-vector lock is the
          # point of this job, so require that tests actually ran.
          passed=$(grep -cE "^\[PASS\]" forge.log || true)
          echo "solidity tests passed: $passed"
          if [ "$passed" -lt 5 ]; then
            echo "::error::only $passed Solidity tests ran; expected 5+"
            exit 1
          fi

  # This job was a bare `echo` with no checkout and no assertion - a green check named "council",
  # which reads as a gate, that could not fail. Live run 31564062895 shows it finishing in 2
  # seconds beside a 2m08s `gate`. Renamed so it no longer impersonates a gate, and given the one
  # assertion it can honestly make: the verdicts it refers to are actually present. The
  # multi-model review itself runs in the authoring environment and cannot run here.
  council-verdicts-present:
    name: Council verdicts are committed (not a review gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: docs/council/ must exist and be non-empty
        run: |
          if [ ! -d docs/council ]; then
            echo "::error::docs/council/ is missing; the council verdicts this repo cites are not in the tree"
            exit 1
          fi
          n=$(find docs/council -type f | wc -l)
          echo "council verdict files: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::docs/council/ is empty"
            exit 1
          fi
