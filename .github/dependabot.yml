# Dependabot configuration (schema v2 — https://docs.github.com/code-security/dependabot).
# Keeps the npm root manifest and the GitHub Actions workflows current with weekly,
# grouped, low-noise update PRs. Security updates from Dependabot are unaffected by
# these schedules and are raised as soon as advisories are published.

version: 2
updates:
  # --- npm (root package.json / package-lock.json) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # Crypto primitives get their own PR. A 0.x "minor" (@noble/post-quantum 0.6 -> 0.7)
      # is semver-breaking, and every @noble bump needs a crypto review before merge.
      # All four @noble packages stay in ONE group on purpose: @noble/post-quantum 0.7.1
      # requires @noble/ciphers, @noble/curves and @noble/hashes at exactly 2.4.0, so
      # splitting them would produce PRs that cannot install.
      noble-crypto:
        applies-to: version-updates
        patterns:
          - "@noble/*"
      # Batch all non-major (minor + patch) bumps into a single PR to cut review noise.
      npm-minor-patch:
        applies-to: version-updates
        exclude-patterns:
          - "@noble/*"
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions (workflows under .github/workflows) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Batch all non-major (minor + patch) action bumps into a single PR.
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
