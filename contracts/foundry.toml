#
# Foundry config for the Nerion interchain reference contracts. These ARE built and tested in CI
# now (.github/workflows/ci.yml, job `contracts`) - the note that they were not was accurate when
# written and is what let the TS<->Solidity golden-vector lock run with only one half compiled.
# Stock solc 0.8.24 + forge-std is enough: the tests exercise evmSetId/evmMessage only, so no QRL
# Zond / Hyperion environment is required to run them. See contracts/README.md.

[profile.default]
src = "."
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# verifyFinality's 10-arg ABI plus locals exceeds the legacy codegen 16-slot
# stack ("Stack too deep" at the total-stake loop). IR pipeline is stock
# solc 0.8.24; it does not change evmSetId/evmMessage encodings the tests lock.
via_ir = true
# Allow tests to read the golden cross-impl vectors if they parse the JSON directly.
fs_permissions = [{ access = "read", path = "./test" }]
